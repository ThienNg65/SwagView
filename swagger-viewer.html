<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swagger Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f5f5f5;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
    }

    #btn-add {
      width: 100%;
      padding: 8px;
      background: #0f3460;
      color: #7ec8e3;
      border: 1px solid #1a5276;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    #btn-add:hover { background: #1a5276; }

    #spec-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .spec-item {
      display: flex;
      align-items: center;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 3px;
      transition: background 0.12s;
      gap: 6px;
    }
    .spec-item:hover { background: #16213e; }
    .spec-item.active { background: #0f3460; }

    .spec-item-name {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spec-item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .spec-item:hover .spec-item-actions,
    .spec-item.active .spec-item-actions { opacity: 1; }

    .icon-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1;
      transition: color 0.12s, background 0.12s;
    }
    .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .icon-btn.delete:hover { color: #ff6b6b; }

    #empty-state {
      padding: 20px 16px;
      text-align: center;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Main content ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888;
      gap: 12px;
    }
    #welcome h2 { font-size: 20px; color: #555; }
    #welcome p { font-size: 14px; }

    #swagger-container {
      flex: 1;
      overflow-y: auto;
      display: none;
      background: #1b1b1b;
      min-height: 0;
    }

    #swagger-container #swagger-ui {
      min-height: 100vh;
    }

    #swagger-container .swagger-ui .topbar { display: none; }

    /* match swagger-ui v5 dark background throughout */
    #swagger-container .swagger-ui {
      background: #1b1b1b;
    }

    #swagger-container .swagger-ui > div:first-child {
      margin-top: 0;
    }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: #fff;
      border-radius: 10px;
      width: 680px;
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    #modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #modal-header h2 { font-size: 16px; color: #333; }

    #modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }
    #modal-close:hover { color: #333; }

    #modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; overflow: hidden; }

    #modal-body label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }

    #spec-name-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #spec-name-input:focus { border-color: #4a90d9; }

    #yaml-textarea {
      width: 100%;
      flex: 1;
      min-height: 320px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.5;
    }
    #yaml-textarea:focus { border-color: #4a90d9; }

    #modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #modal-error { font-size: 13px; color: #e74c3c; flex: 1; }

    .modal-btn {
      padding: 9px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .modal-btn.secondary { background: #f0f0f0; color: #555; }
    .modal-btn.secondary:hover { background: #e0e0e0; }
    .modal-btn.primary { background: #2b6cb0; color: #fff; }
    .modal-btn.primary:hover { background: #2563a8; }

    #import-btn {
      padding: 7px 14px;
      background: #f0f0f0;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    #import-btn:hover { background: #e4e4e4; }
    #file-input { display: none; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>📄 Swagger Viewer</h1>
    <button id="btn-add" onclick="openModal()">+ Add Spec</button>
  </div>
  <div id="spec-list">
    <div id="empty-state">No specs yet.<br/>Click <strong>+ Add Spec</strong> to get started.</div>
  </div>
</div>

<!-- Main area -->
<div id="main">
  <div id="welcome">
    <h2>Swagger Viewer</h2>
    <p>Select a spec from the sidebar to view it.</p>
  </div>
  <div id="swagger-container"></div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <h2 id="modal-title">Add Spec</h2>
      <button id="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body">
      <div>
        <label for="spec-name-input">Spec Name</label>
        <input id="spec-name-input" type="text" placeholder="e.g. User Service API v2" />
      </div>
      <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
          <label style="margin:0">YAML Content</label>
          <div>
            <input type="file" id="file-input" accept=".yaml,.yml" onchange="loadFile(event)" />
            <button id="import-btn" onclick="document.getElementById('file-input').click()">Import .yaml file</button>
          </div>
        </div>
        <textarea id="yaml-textarea" placeholder="Paste your OpenAPI YAML here..."></textarea>
      </div>
    </div>
    <div id="modal-footer">
      <span id="modal-error"></span>
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="saveSpec()">Save</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
  const STORAGE_KEY = 'swagger_specs';
  let specs = [];       // [{ id, name, yaml }]
  let activeId = null;
  let editingId = null;
  let swaggerUI = null;

  // ── Storage ──────────────────────────────────────────────
  function loadSpecs() {
    try { specs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { specs = []; }
  }

  function saveSpecs() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(specs));
  }

  // ── Sidebar rendering ─────────────────────────────────────
  function renderSidebar() {
    const list = document.getElementById('spec-list');
    if (specs.length === 0) {
      list.innerHTML = '<div id="empty-state">No specs yet.<br/>Click <strong>+ Add Spec</strong> to get started.</div>';
      return;
    }
    list.innerHTML = specs.map(s => `
      <div class="spec-item ${s.id === activeId ? 'active' : ''}" onclick="selectSpec('${s.id}')">
        <span class="spec-item-name" title="${escHtml(s.name)}">${escHtml(s.name)}</span>
        <span class="spec-item-actions">
          <button class="icon-btn" title="Edit" onclick="event.stopPropagation(); openModal('${s.id}')">✏️</button>
          <button class="icon-btn delete" title="Delete" onclick="event.stopPropagation(); deleteSpec('${s.id}')">🗑</button>
        </span>
      </div>
    `).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Select & render spec ──────────────────────────────────
  function selectSpec(id) {
    const spec = specs.find(s => s.id === id);
    if (!spec) return;
    activeId = id;
    renderSidebar();

    document.getElementById('welcome').style.display = 'none';
    const container = document.getElementById('swagger-container');
    container.style.display = 'block';
    container.innerHTML = '<div id="swagger-ui"></div>';

    try {
      swaggerUI = SwaggerUIBundle({
        spec: jsyaml.load(spec.yaml),
        domNode: document.getElementById('swagger-ui'),
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
        deepLinking: true,
      });
    } catch (e) {
      container.innerHTML = `<div style="padding:40px; color:#c0392b; font-family:monospace;">
        <strong>Failed to parse YAML:</strong><br/><pre style="margin-top:10px; white-space:pre-wrap">${escHtml(e.message)}</pre>
      </div>`;
    }
  }

  // ── Modal ────────────────────────────────────────────────
  function openModal(id = null) {
    editingId = id;
    document.getElementById('modal-error').textContent = '';
    document.getElementById('modal-title').textContent = id ? 'Edit Spec' : 'Add Spec';

    if (id) {
      const spec = specs.find(s => s.id === id);
      document.getElementById('spec-name-input').value = spec.name;
      document.getElementById('yaml-textarea').value = spec.yaml;
    } else {
      document.getElementById('spec-name-input').value = '';
      document.getElementById('yaml-textarea').value = '';
    }
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('spec-name-input').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    editingId = null;
  }

  function saveSpec() {
    const name = document.getElementById('spec-name-input').value.trim();
    const yaml = document.getElementById('yaml-textarea').value.trim();
    const errEl = document.getElementById('modal-error');

    if (!name) { errEl.textContent = 'Please enter a spec name.'; return; }
    if (!yaml) { errEl.textContent = 'Please enter YAML content.'; return; }

    try { jsyaml.load(yaml); } catch (e) {
      errEl.textContent = 'Invalid YAML: ' + e.message;
      return;
    }

    if (editingId) {
      const spec = specs.find(s => s.id === editingId);
      spec.name = name;
      spec.yaml = yaml;
    } else {
      specs.push({ id: crypto.randomUUID(), name, yaml });
    }

    saveSpecs();
    renderSidebar();
    closeModal();

    // Re-render if currently viewing the edited spec
    if (editingId && editingId === activeId) selectSpec(activeId);
  }

  function deleteSpec(id) {
    if (!confirm('Delete this spec?')) return;
    specs = specs.filter(s => s.id !== id);
    saveSpecs();
    if (activeId === id) {
      activeId = null;
      document.getElementById('swagger-container').style.display = 'none';
      document.getElementById('welcome').style.display = 'flex';
    }
    renderSidebar();
  }

  // ── File import ───────────────────────────────────────────
  function loadFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('yaml-textarea').value = e.target.result;
      if (!document.getElementById('spec-name-input').value) {
        document.getElementById('spec-name-input').value = file.name.replace(/\.(yaml|yml)$/i, '');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // ── Keyboard shortcuts ────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) {
      saveSpec();
    }
  });

  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  // ── Bootstrap ─────────────────────────────────────────────
  // Load js-yaml from CDN dynamically
  const yamlScript = document.createElement('script');
  yamlScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js';
  yamlScript.onload = () => {
    loadSpecs();
    renderSidebar();
    // Auto-select first spec if available
    if (specs.length > 0) selectSpec(specs[0].id);
  };
  document.head.appendChild(yamlScript);
</script>
</body>
</html>
